name: Checks

# Deliberately a separate workflow, not steps in docker-image.yml: by
# convention nothing is verified inside the image build (the emulated arm64
# build OOM-killed the in-image test run). This is where the checks live
# instead — no Docker build, no registry.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Follows go.mod rather than a number kept in step with it by hand.
          go-version-file: go.mod
          cache: true

      # internal/generated_docs/ is generated and gitignored, so a fresh clone
      # does not compile at all: internal/webserver imports it. Unlike the other
      # two services this one embeds no TS client, so swag alone suffices — no Node.
      - name: Generate embedded docs
        run: make generate-docs

      - name: go vet
        run: go vet ./...

      # Runs even after a failed vet, so one push reports both problems
      # instead of hiding the second behind the first.
      - name: Tests
        if: '!cancelled()'
        run: make test

      # Known vulnerabilities in the code and its dependencies, from the Go vulnerability database. Fails only for what the code actually reaches; a vulnerable module it never calls is listed, not failed. Pinned so a new scanner release cannot break the run on its own.
      - name: govulncheck
        if: '!cancelled()'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The Go client module in client/ (github.com/pfisterer/role-provider-service/client), held against the spec this commit generates. client.gen.go is committed because consumers take the module straight from a client/vX.Y.Z tag, so an API change without `make client` would tag a client that describes the previous API: it compiles in the consumers and turns into a 404 or a silently dropped field at runtime. Own job because it needs Node (swagger2openapi), which the checks job deliberately has none of.
  go-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            client/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Regenerate the Go client
        run: make client

      # On client/ by path, not on the whole tree: `npm install` in that target may touch package-lock.json, which is not what this job is asking about.
      - name: It matches what is committed
        run: |
          set -euo pipefail
          git diff --exit-code -- client/ || {
            echo "::error::client/ does not match the API this commit describes."
            echo "Run 'make client' and commit the result."
            exit 1
          }
          untracked=$(git ls-files --others --exclude-standard -- client/)
          if [ -n "$untracked" ]; then
            echo "::error::make client created files that are not committed: $untracked"
            exit 1
          fi

      # The module is built, vetted and scanned on its own: the root module's ./... stops at client/go.mod.
      - name: Build, vet, test and govulncheck the client module
        working-directory: client
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
