{{- $name := include "role-provider-service.fullname" . -}}
{{- $secretName := default $name .Values.roleProviderService.existingSecret -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "role-provider-service.rolloutAnnotations" . | nindent 4 }}
    # Restart this Deployment when the referenced Secret changes (Stakater Reloader)
    secret.reloader.stakater.com/reload: {{ $secretName }}
  labels:
    {{- include "role-provider-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.roleProviderService.replicas }}
  selector:
    matchLabels:
      {{- include "role-provider-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "role-provider-service.rolloutAnnotations" . | nindent 8 }}
      labels:
        {{- include "role-provider-service.selectorLabels" . | nindent 8 }}
    spec:
      # This pod never talks to the Kubernetes API — do not hand it a token for it.
      automountServiceAccountToken: false
      volumes:
        # Writable scratch so the container rootfs can stay read-only.
        - name: tmp
          emptyDir: {}
      containers:
        - name: role-provider-service
          # The tag falls back to this chart's appVersion, which is what makes a
          # pinned chart version pin the image too: under the umbrella chart no
          # version is passed at all, so "new chart, old image" cannot occur.
          # An explicit value still wins — that is how argocd-image-updater
          # keeps driving the standalone releases.
          image: {{ .Values.roleProviderService.image }}:{{ .Values.roleProviderService.version | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.roleProviderService.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: {{ .Values.roleProviderService.port }}
          # Hardening: non-root, no privilege escalation, no capabilities,
          # read-only rootfs, default seccomp. The image sets USER 65532.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            # ── Database ────────────────────────────────────────────────────
            - name: DB_TYPE
              value: {{ .Values.roleProviderService.db.type | default "memory" | quote }}
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: db-connection-string

            # ── Web Server / API ─────────────────────────────────────────────
            - name: API_BIND
              value: ":{{ .Values.roleProviderService.port }}"
            - name: API_MODE
              value: {{ .Values.roleProviderService.api.mode | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," (.Values.roleProviderService.api.corsAllowedOrigins | default list) | quote }}
            # Read-only tokens: consumers query the graph with these.
            - name: API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: api-tokens
            # Write tokens: may change groups, memberships and sync sources.
            # Optional key — missing/empty means nothing may write.
            - name: API_WRITE_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: api-write-tokens
                  optional: true

            # ── Miscellaneous ────────────────────────────────────────────────
            - name: SERVICE_TIMEOUT_SECONDS
              value: {{ .Values.roleProviderService.serviceTimeoutSeconds | toString | quote }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "role-provider-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "role-provider-service.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.roleProviderService.port }}
      targetPort: {{ .Values.roleProviderService.port }}

{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.roleProviderService.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ .Values.roleProviderService.port }}
  tls:
    - hosts:
        - {{ .Values.roleProviderService.hostname | quote }}
{{- end }}
