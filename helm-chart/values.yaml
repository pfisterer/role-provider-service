# Dependency condition of the cloud-self-service umbrella chart, which decides by
# this key whether to install this chart at all. Set it there, not here: a
# standalone `helm install` of this chart ignores it entirely.
enabled: true

roleProviderService:
  image: ghcr.io/pfisterer/role-provider-service
  imagePullPolicy: Always
  # Empty -> the chart\'s appVersion is used (see the deployment template).
  version: ""
  hostname: "role-provider.example.com"
  replicas: 1
  port: 8085

  # Name of an existing Secret providing the keys `db-connection-string` and
  # `api-tokens`. When set, the chart does NOT create its own Secret and the
  # `db.connectionString` / `api.tokens` values below are ignored.
  existingSecret: ""

  db:
    # Storage backend: "memory" (default, ephemeral + mock seed) or "postgres"
    # (persistent, uses connectionString / the existingSecret db-connection-string).
    type: "memory"
    connectionString: "host=localhost user=postgres password=postgres
      dbname=group_auth_service port=5432 sslmode=disable TimeZone=UTC"

  api:
    mode: "production"
    # Read-only tokens (comma-separated). Consumers of the graph get these.
    # Without existingSecret this must be set to a real secret of at least 32
    # characters; the schema refuses the empty default.
    tokens: ""
    # Write tokens (comma-separated). Required for creating/changing groups,
    # memberships and sync sources. Empty = nobody may write via the API.
    writeTokens: ""
    # Browser origins allowed to call /v1 cross-origin. This API is consumed by
    # other services with an API token, so the empty default (no cross-origin
    # access) is the normal setting.
    corsAllowedOrigins: []

  serviceTimeoutSeconds: 30

  # Relations a group can carry besides "member", which is always there. A user
  # holding one gets "group:<id>#<relation>" in addition to "group:<id>".
  # Imports or API calls naming any other relation are refused.
  groupRelations: []

  # Keycloak source: groups derived from the attributes Keycloak holds about
  # every user who has signed in (e.g. the bwIDM affiliation). Empty realmUrl
  # disables it. The service account needs realm-management/view-users only.
  keycloak:
    realmUrl: ""
    clientId: ""
    # Used only when the chart creates its own Secret; with existingSecret the
    # key keycloak-client-secret there is read instead.
    clientSecret: ""
    syncSchedule: "*/15 * * * *"
    # attribute, all_group, locations, roles, ignored_scopes, ignored_values —
    # see the README. Every relation named under roles must be in groupRelations.
    mapping: {}

  # Name of the source that holds the groups maintained through the API and the
  # self-service UI, shown next to them ("wwi23seb (ZWR)").
  localSourceName: "local"

  # CSV/LDIF sources whose groups and memberships pass to the local source at
  # startup; each is deleted afterwards. Once done there is nothing left to
  # adopt, so an entry can stay until it is removed.
  adoptSources: []

  # Tokens that maintain every local group, create and delete groups, and may act
  # on behalf of another person (X-Act-As), e.g. ["group:root-admin"].
  adminTokens: []

  # Identity provider of the self-service UI. With issuerUrl set, people signed
  # in there maintain the groups they manage under /v1/manage, reached through
  # the UI's proxy; empty leaves /v1/manage out. clientId is the audience of the
  # ID token the proxy forwards; jwksUrl spares a discovery request at startup.
  oidc:
    issuerUrl: ""
    clientId: ""
    jwksUrl: ""

ingress:
  enabled: true
  # Empty className -> field omitted -> cluster default IngressClass (Traefik on
  # k3s). No cert-manager annotation: TLS = cluster wildcard default cert.
  className: ""
  annotations: {}
